name: alien_launcher
description: "Alien App Launcher & Suite"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  dio: ^5.4.1
  path_provider: ^2.1.2
  installed_apps: ^2.2.1
  install_plugin: ^2.1.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1 

flutter:
  uses-material-design: true

  assets:
    - assets/icons/

  fonts:
    - family: Jost
      fonts:
        - asset: assets/fonts/Jost-Regular.ttf
        - asset: assets/fonts/Jost-Medium.ttf
          weight: 500
        - asset: assets/fonts/Jost-Bold.ttf
          weight: 700
    - family: Gideon_Roman
      fonts:
        - asset: assets/fonts/Gideon_Roman.ttf
    - family: Bitcount_Prop_Single
      fonts:
        - asset: assets/fonts/Bitcount_Prop_Single.ttf

